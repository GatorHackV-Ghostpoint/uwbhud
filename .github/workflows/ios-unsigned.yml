# Builds an UNSIGNED iPhone app on GitHub's Macs. Download the .ipa from the run's
# "Artifacts" section and install it with Sideloadly (Windows) using your free Apple ID.
#
# Debug   = development client: loads your JS live from `npx expo start`
# Release = standalone: JS bundled inside, works without your PC
name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Debug (dev client) or Release (standalone)
        type: choice
        options: [Debug, Release]
        default: Debug

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate native iOS project (also runs pod install)
        run: npx expo prebuild --platform ios --clean

      - name: Build without code signing
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Xcode: $(xcodebuild -version | head -1)  Workspace: $WS  Scheme: $SCHEME"
          if ! xcodebuild -workspace "$WS" -scheme "$SCHEME" \
               -configuration "${{ inputs.configuration }}" \
               -sdk iphoneos -destination 'generic/platform=iOS' \
               -derivedDataPath build \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
               build > xcodebuild.log 2>&1; then
            echo "================ ERRORS ================"
            grep -nE "error:|fatal error|ld: |Undefined symbol" xcodebuild.log | head -100
            echo "================ FAILED COMMANDS ================"
            grep -A 15 "The following build commands failed" xcodebuild.log
            exit 1
          fi
          tail -n 20 xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/${{ inputs.configuration }}-iphoneos/*.app Payload/
          zip -qr UWBHud-${{ inputs.configuration }}-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: UWBHud-${{ inputs.configuration }}-unsigned
          path: UWBHud-${{ inputs.configuration }}-unsigned.ipa
